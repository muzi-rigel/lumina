app:
  name: lumina
  version: 0.1.0
  timezone: Asia/Shanghai

runtime:
  log_level: INFO

market:
  source: mock
  interval_seconds: 5
  mock:
    seed: 42

storage:
  type: sqlite
  path: data/lumina.db

notify:
  wechat:
    enabled: false
    webhook_env: LUMINA_WECHAT_WEBHOOK_URL
    timeout_seconds: 5
    max_attempts: 3
    retry_backoff_seconds: 1
    max_total_seconds: 15
