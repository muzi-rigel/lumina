app:
  name: lumina
  version: 0.1.0
  timezone: Asia/Shanghai

runtime:
  log_level: INFO

market:
  source: mock
  interval_seconds: 5
  mock:
    seed: 42
  tencent:
    url: https://qt.gtimg.cn/q=
    timeout_seconds: 3
    batch_size: 50
    max_attempts: 2
    retry_backoff_seconds: 0.5
    max_total_seconds: 8

storage:
  type: sqlite
  path: data/lumina.db

notify:
  wechat:
    enabled: false
    webhook_env: LUMINA_WECHAT_URL
    timeout_seconds: 5
    max_attempts: 3
    retry_backoff_seconds: 1
    max_total_seconds: 15
