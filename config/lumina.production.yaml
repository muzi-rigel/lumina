# Lumina Ubuntu/systemd 生产配置模板。
scheduler:
  interval_seconds: 30

logging:
  level: INFO
  # 交由 journald 收集和轮转，避免应用与系统重复管理日志。
  file: null
  max_bytes: 10485760
  backup_count: 10

storage:
  # lumina.service 的 StateDirectory 会创建并授权此目录。
  database: /var/lib/lumina/lumina.db
  busy_timeout_seconds: 10
